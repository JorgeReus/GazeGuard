name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - parallel:
          - uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: '21'
              cache: gradle
          - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - run: npm install
      - run: npm run build

      - name: Generate Tauri Android files
        working-directory: src-tauri
        run: |
          rm -f gen/android/tauri.settings.gradle
          npx tauri android init --ci --skip-targets-install || true
          sed -i 's/gradle-9\.1\.0-bin/gradle-8\.14\.3-bin/' gen/android/gradle/wrapper/gradle-wrapper.properties
          npx tauri android build --debug --apk --ci
          test -s gen/android/tauri.settings.gradle
          ls -l gen/android/tauri.settings.gradle

      - name: Run Android unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew app:testUniversalDebugUnitTest
