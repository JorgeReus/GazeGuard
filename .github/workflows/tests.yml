name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - parallel:
          - uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: '21'
              cache: gradle
          - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.1 --locked

      - name: Generate Tauri Android files
        working-directory: src-tauri
        run: |
          rm -f gen/android/tauri.settings.gradle
          cargo tauri android init --ci --skip-targets-install || test -f gen/android/tauri.settings.gradle
          test -f gen/android/tauri.settings.gradle

      - name: Run Android unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew app:testUniversalDebugUnitTest
