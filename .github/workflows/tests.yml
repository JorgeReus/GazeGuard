name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@nextest
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo nextest run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - parallel:
          - uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: '21'
              cache: gradle
          - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - run: npm install
      - run: npm run build

      - name: Generate Tauri Android files
        working-directory: src-tauri
        run: |
          rm -f gen/android/tauri.settings.gradle
          npx tauri android init --ci --skip-targets-install || true
          sed -i 's/gradle-9\.1\.0-bin/gradle-8\.14\.3-bin/' gen/android/gradle/wrapper/gradle-wrapper.properties
          npx tauri android build --debug --apk --ci
          test -s gen/android/tauri.settings.gradle
          ls -l gen/android/tauri.settings.gradle

      - name: Run Android unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew app:testUniversalDebugUnitTest

  webdriver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebDriver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            xvfb

      - run: npm ci
      - name: Run WebDriverIO E2E tests
        id: e2e
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum npm run test:e2e' || 'npm run test:e2e' }}

      - name: Upload WebdriverIO logs
        if: ${{ failure() || steps.e2e.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-${{ matrix.os }}-logs
          path: logs
          if-no-files-found: ignore

      - name: Check WebDriverIO result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          case "$OUTCOME" in
            success) echo "WebDriverIO E2E: success" ;;
            failure)
              if [ "$RUNNER_OS" = "Windows" ]; then
                echo "::warning::Windows WebDriverIO E2E failure allowed: WebView2 150+ blocks remote debugging for elevated GitHub runners (https://github.com/webdriverio/desktop-mobile/issues/542)"
              else
                echo "::error::WebDriverIO E2E failed"
                exit 1
              fi ;;
            *)
              echo "::error::Unexpected WebDriverIO E2E outcome: $OUTCOME"
              exit 1 ;;
          esac
