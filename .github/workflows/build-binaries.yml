name: Build binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Resolve Release Please release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id) || {
            echo "Release Please has not created $GITHUB_REF_NAME yet"
            exit 1
          }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - parallel:
          - uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: '21'
              cache: gradle
          - uses: android-actions/setup-android@v4
          - uses: dtolnay/rust-toolchain@stable
            with:
              targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - name: Route generated Android Cargo calls to npm CLI
        run: |
          real_cargo=$(command -v cargo)
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"
          printf '#!/bin/sh\nif [ "$1" = "tauri" ]; then shift; exec npx tauri "$@"; fi\nexec %s "$@"\n' "$real_cargo" > "$GITHUB_WORKSPACE/.ci-bin/cargo"
          chmod +x "$GITHUB_WORKSPACE/.ci-bin/cargo"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - parallel:
          - name: Install Android SDK
            run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          mobile: android
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: '--apk --target aarch64 armv7 i686 x86_64 --ci'
          uploadWorkflowArtifacts: true

  macos:
    needs: prepare-release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: '--target universal-apple-darwin --bundles app,dmg --ci'
          uploadWorkflowArtifacts: true

  windows:
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: '--bundles nsis,msi --ci'
          uploadWorkflowArtifacts: true

  linux:
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - run: npm ci
      - run: npm run build

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: '--bundles appimage,deb,rpm --ci'
          uploadWorkflowArtifacts: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare-release, android, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
