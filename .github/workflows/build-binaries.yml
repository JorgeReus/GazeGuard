name: Build binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - parallel:
          - uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: '21'
              cache: gradle
          - uses: android-actions/setup-android@v4
          - uses: dtolnay/rust-toolchain@stable
            with:
              targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - name: Route generated Android Cargo calls to npm CLI
        run: |
          real_cargo=$(command -v cargo)
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"
          printf '#!/bin/sh\nif [ "$1" = "tauri" ]; then shift; exec npx tauri "$@"; fi\nexec %s "$@"\n' "$real_cargo" > "$GITHUB_WORKSPACE/.ci-bin/cargo"
          chmod +x "$GITHUB_WORKSPACE/.ci-bin/cargo"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - parallel:
          - name: Install Android SDK
            run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          mobile: android
          args: '--apk --target aarch64 armv7 i686 x86_64 --ci'
          uploadWorkflowArtifacts: true

  macos:
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          args: '--target universal-apple-darwin --bundles dmg --no-sign --ci'
          uploadWorkflowArtifacts: true

  linux:
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - run: npm ci
      - run: npm run build

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          args: '--bundles appimage,deb,rpm --ci'
          uploadWorkflowArtifacts: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
