<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take a Break</title>
  <style>
    :root { --break-bg:#f8f9ff; --break-text:#121c2a; --break-muted:#404848; --break-secondary:#585c5f; --break-border:#bfc8c8; --break-primary:#306363; --break-primary-container:#4a7c7c; }
    :root[data-theme="dark"] { --break-bg:#202124; --break-text:#f6f6f6; --break-muted:#c7cccc; --break-secondary:#b8bfc2; --break-border:#555b60; --break-primary:#9cd0d0; }
    @media (prefers-color-scheme: dark) { :root[data-theme="system"] { --break-bg:#202124; --break-text:#f6f6f6; --break-muted:#c7cccc; --break-secondary:#b8bfc2; --break-border:#555b60; --break-primary:#9cd0d0; } }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: var(--break-bg);
      color: var(--break-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 24px 24px 120px;
    }
    .break-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: break-fade-in 500ms ease-out both;
    }
    body.is-exiting .break-content {
      animation: break-fade-out 350ms ease-in both;
    }
    .action-bar {
      animation: controls-fade-in 450ms 150ms ease-out both;
    }
    body.is-exiting .action-bar {
      animation: controls-fade-out 250ms ease-in both;
    }
    @keyframes break-fade-in {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes break-fade-out {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.98); }
    }
    @keyframes controls-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes controls-fade-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .break-content, .action-bar, body.is-exiting .break-content, body.is-exiting .action-bar { animation-duration: 1ms; animation-delay: 0ms; }
    }
    .pulse-ring { position:absolute; inset:0; border:2px solid var(--break-primary); opacity:.2; border-radius:50%; animation:pulse-ring 4s cubic-bezier(.4,0,.2,1) infinite; }
    .pulse-ring.inner { inset:16px; border-width:1px; animation-delay:500ms; }
    .indicator { position:relative; width:192px; height:192px; margin-bottom:48px; display:grid; place-items:center; }
    .indicator-icon { position:relative; z-index:1; width:96px; height:96px; display:grid; place-items:center; border-radius:50%; color:#ecfffe; background:var(--break-primary-container); font-size:48px; box-shadow:0 8px 24px #30636333; }
    .guidance { margin-top:16px; color:var(--break-muted); font-size:24px; }
    .hint { margin-top:8px; color:var(--break-secondary); font-size:18px; }
    @keyframes pulse-ring { 0% { transform:scale(.95); box-shadow:0 0 0 0 #30636366; } 50% { transform:scale(1.05); box-shadow:0 0 0 40px #30636300; } 100% { transform:scale(.95); box-shadow:0 0 0 0 #30636300; } }
    @media (prefers-reduced-motion: reduce) { .pulse-ring { animation:none; } }
    .message {
      font-size: 0;
      height: 0;
      text-align: center;
    }
    .timer {
      color: var(--break-text);
      font-size: 80px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .skip-button {
      background: var(--break-bg);
      border: 2px solid var(--break-border);
      color: var(--break-text);
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .skip-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .action-bar {
      position: fixed;
      left: 50%;
      width: min(448px, calc(100% - 48px));
      transform: translateX(-50%);
      bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .action-bar > button, .postpone-controls { flex:1; }
    .postpone-controls {
      position: relative;
      display: flex;
      align-items: center;
    }
    .postpone-button {
      background: var(--break-bg);
      border: 2px solid var(--break-border);
      color: var(--break-text);
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .postpone-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .postpone-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      display: none;
      flex-direction: column;
      min-width: 180px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(18, 18, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      gap: 6px;
    }
    .postpone-option {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .postpone-option:hover {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <div class="break-content">
    <div class="indicator" aria-hidden="true"><div class="pulse-ring"></div><div class="pulse-ring inner"></div><div class="indicator-icon">◉</div></div>
    <div class="message" id="message">Take a Break</div>
    <div class="timer" id="timer">0:00</div>
    <div class="guidance">Time to rest your eyes.</div>
    <div class="hint">Look at something 6 meters away.</div>
  </div>
  <div class="action-bar">
    <button class="skip-button" id="skip">› Skip</button>
    <div class="postpone-controls" id="postponeControls">
      <button class="postpone-button" id="postpone">◷ Postpone</button>
      <div class="postpone-menu" id="postponeMenu"></div>
    </div>
  </div>

<script>
  let invoke;
  const timerElement = document.getElementById('timer');
  const skipButton = document.getElementById('skip');
  const postponeButton = document.getElementById('postpone');
  const postponeControls = document.getElementById('postponeControls');
  const postponeMenu = document.getElementById('postponeMenu');
  const messageElement = document.getElementById('message');
  let timerId = null;
  let timeLeft = 0;
  let engineStatusErrorShown = false;
  let postponeOptions = [];
  let postponeEnabled = false;
  let closing = false;

  document.documentElement.dataset.theme = localStorage.getItem('gazeguard-theme') || 'system';

  async function finishBreak(command) {
    if (closing) return;
    closing = true;
    document.body.classList.add('is-exiting');
    await new Promise((resolve) => setTimeout(resolve, 350));
    await invoke(command);
  }

  async function waitForTauriInvoke() {
    if (window.__TAURI__?.core?.invoke) {
      return window.__TAURI__.core.invoke;
    }
    return new Promise((resolve) => {
      const intervalId = setInterval(() => {
        if (window.__TAURI__?.core?.invoke) {
          clearInterval(intervalId);
          resolve(window.__TAURI__.core.invoke);
        }
      }, 50);
    });
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  function labelFromTemplate(name) {
    return name
      .replace(/_/g, ' ')
      .replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function setSkipState(canSkip, skipLimitReached) {
    const disabled = skipLimitReached || !canSkip;
    skipButton.disabled = disabled;
    skipButton.style.opacity = disabled ? '0.4' : '1';
    skipButton.style.cursor = disabled ? 'not-allowed' : 'pointer';
    if (skipLimitReached) {
      skipButton.textContent = 'Skip Locked';
    } else if (!canSkip) {
      skipButton.textContent = 'Mandatory Break';
    } else {
      skipButton.textContent = 'Skip Break';
    }
  }

  function setPostponeState(canPostpone) {
    postponeEnabled = canPostpone && postponeOptions.length > 0;
    postponeControls.style.display = postponeOptions.length ? 'flex' : 'none';
    postponeButton.disabled = !postponeEnabled;
    postponeButton.style.opacity = postponeEnabled ? '1' : '0.4';
    postponeButton.style.cursor = postponeEnabled ? 'pointer' : 'not-allowed';
    postponeButton.textContent = postponeEnabled ? 'Postpone Break' : 'Postpone Disabled';
    if (!postponeEnabled) {
      hidePostponeMenu();
    }
  }

  function formatPostponeOption(option) {
    const labelUnit = option.duration === 1
      ? option.unit.replace(/s$/, '')
      : option.unit;
    return `${option.duration} ${labelUnit}`;
  }

  function renderPostponeOptions(options) {
    postponeOptions = options ?? [];
    postponeMenu.innerHTML = '';

    postponeOptions.forEach((option) => {
      const optionEl = document.createElement('button');
      optionEl.type = 'button';
      optionEl.className = 'postpone-option';
      optionEl.textContent = formatPostponeOption(option);
      optionEl.addEventListener('click', async () => {
        try {
          if (timerId !== null) {
            clearTimeout(timerId);
            timerId = null;
          }
          await invoke('postpone_break', { seconds: option.seconds });
        } catch (e) {
          console.error(e);
        }
      });
      postponeMenu.appendChild(optionEl);
    });

    postponeControls.style.display = postponeOptions.length ? 'flex' : 'none';
  }

  function showPostponeMenu() {
    if (!postponeEnabled) return;
    postponeMenu.style.display = 'flex';
  }

  function hidePostponeMenu() {
    postponeMenu.style.display = 'none';
  }

  function updateTimer() {
    timerElement.textContent = formatTime(timeLeft);

    if (timeLeft <= 0) {
      finishBreak('complete_break').catch(console.error);
      return;
    }

    timeLeft -= 1;
    timerId = setTimeout(updateTimer, 1000);
  }

  function showBreakUnavailable(message) {
    messageElement.textContent = message;
    timerElement.textContent = '0:00';
    skipButton.disabled = true;
    skipButton.style.opacity = '0.4';
    skipButton.style.cursor = 'not-allowed';
    skipButton.textContent = 'Break Ended';
    setPostponeState(false);
  }

  function applyBreakState(info, status) {
    timeLeft = status?.seconds_remaining ?? info.duration_seconds;
    messageElement.textContent = info.template_name
      ? labelFromTemplate(info.template_name)
      : (info.kind === 'long' ? 'Take a Long Break' : 'Take a Short Break');
    setSkipState(Boolean(status?.can_skip), Boolean(status?.skip_limit_reached));
    setPostponeState(Boolean(status?.can_postpone));
    updateTimer();
  }

  async function initBreak() {
    try {
      const schedule = await invoke('get_break_schedule');
      renderPostponeOptions(schedule.postpone_options);
    } catch (error) {
      console.error('Failed to load break schedule on break page', error);
    }

    let status;
    try {
      status = await invoke('get_engine_status');
      console.log('break.html engine status', status);
    } catch (error) {
      console.error('Failed to load engine status for break page', error);
    }

    if (status?.phase === 'on_break' && status.current_break) {
      applyBreakState(status.current_break, status);
      return;
    }

    try {
      const info = await invoke('get_current_break_info');
      applyBreakState(info, status);
      return;
    } catch (error) {
      console.error('No active break info available on break page', error);
    }

    if (!engineStatusErrorShown) {
      engineStatusErrorShown = true;
      showBreakUnavailable('Break already ended');
    }
  }

  skipButton.addEventListener('click', async () => {
    try {
      if (timerId !== null) {
        clearTimeout(timerId);
        timerId = null;
      }
      await finishBreak('skip_break');
    } catch (e) {
      console.error(e);
    }
  });

  postponeButton.addEventListener('click', async () => {
    if (!postponeEnabled) {
      return;
    }

    if (postponeMenu.style.display === 'flex') {
      hidePostponeMenu();
    } else {
      showPostponeMenu();
    }
  });

  document.addEventListener('click', (event) => {
    if (!postponeControls.contains(event.target)) {
      hidePostponeMenu();
    }
  });

  async function bootstrap() {
    invoke = await waitForTauriInvoke();
    if (window.AndroidBridge?.enterImmersiveMode) {
      window.AndroidBridge.enterImmersiveMode();
    }
    await initBreak();
  }

  bootstrap().catch(console.error);
</script>
</body>
</html>
